<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Question</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; padding: 16px;
      background: #fdf3e1;
      font-family: 'Press Start 2P', monospace;
      color: #2d2a4a;
    }
    #stage {
      position: relative;
      border: 4px solid #2d2a4a;
      box-shadow: 6px 6px 0 #2d2a4a;
      line-height: 0;
    }
    canvas { display: block; }

    /* Speech bubble that floats over the scene */
    .bubble {
      position: absolute;
      transform: translateY(-100%);
      background: #fff;
      border: 3px solid #2d2a4a;
      padding: 10px 12px;
      line-height: 1.6;
      text-align: center;
      width: max-content;
      box-shadow: 3px 3px 0 rgba(45, 42, 74, 0.35);
    }
    .bubble::after {
      content: '';
      position: absolute; left: var(--tail, 50%); bottom: -9px;
      width: 12px; height: 12px; background: #fff;
      border-right: 3px solid #2d2a4a; border-bottom: 3px solid #2d2a4a;
      transform: translateX(-50%) rotate(45deg);
    }
    .hidden { display: none !important; }

    /* Buttons that appear inside the scene */
    .game-btn {
      position: absolute; z-index: 5;
      transform: translate(-50%, -50%);
      width: max-content; max-width: 90%;
      font-family: inherit; font-size: calc(var(--px, 2) * 3px + 3px); line-height: 1.5;
      padding: 0.8em 1.2em; cursor: pointer;
      border: 3px solid #2d2a4a; box-shadow: 3px 3px 0 #2d2a4a;
    }
    #meepBtn {
      background: #fffaf0; color: #d63a6f;
      font-size: calc(var(--px, 2) * 4px + 2px);
      max-width: 75%; text-align: center; text-wrap: balance;
      border-width: 4px; box-shadow: 4px 4px 0 #2d2a4a;
      animation: bob 1.2s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translate(-50%, -50%); }
      50%      { transform: translate(-50%, calc(-50% - 4px)); }
    }
    #yesBtn  { background: #7bd389; color: #2d2a4a; font-size: calc(var(--px, 2) * 4px + 4px); }
    #yesBtn.ready {
      transition: left 0.5s ease, top 0.5s ease;
      animation: glow 0.7s ease-in-out infinite alternate;
    }
    @keyframes glow { to { box-shadow: 3px 3px 0 #2d2a4a, 0 0 18px 6px #fff36b; } }

    /* Friday / Saturday / Sunday choices */
    .choices {
      position: absolute; z-index: 5;
      left: 50%; top: calc(var(--px, 2) * 40px);
      transform: translate(-50%, -50%);
      display: flex; gap: calc(var(--px, 2) * 3px);
      animation: pop 0.25s ease-out;
    }
    .choices button {
      font-family: inherit; font-size: calc(var(--px, 2) * 3px + 3px); line-height: 1.5;
      padding: 0.8em 0.9em; cursor: pointer;
      background: #fffaf0; color: #2d2a4a;
      border: 3px solid #2d2a4a; box-shadow: 3px 3px 0 #2d2a4a;
    }
    .choices button:hover { background: #7bd389; }

    /* Last scene: HAPPY HAPPY HAPPY */
    .finale {
      position: absolute; left: 0; right: 0; z-index: 6;
      top: calc(var(--px, 2) * 16px);
      text-align: center; line-height: 1.6; pointer-events: none;
      animation: pop 0.3s ease-out;
    }
    .finale .happy {
      display: flex; justify-content: center; gap: 0.6em;
      font-size: calc(var(--px, 2) * 5px + 2px);
      color: #fff36b; text-shadow: 3px 3px 0 #2d2a4a;
    }
    .finale .happy span { animation: hop 0.35s ease-in-out infinite alternate; }
    .finale .happy span:nth-child(2) { animation-delay: 0.12s; }
    .finale .happy span:nth-child(3) { animation-delay: 0.24s; }
    @keyframes hop { to { transform: translateY(-0.5em); } }
    .finale .day {
      margin-top: 0.9em;
      font-size: calc(var(--px, 2) * 3px + 4px);
      color: #fff; text-shadow: 2px 2px 0 #2d2a4a;
    }

    /* The MUEHEHEHE popup */
    .popup {
      position: absolute; inset: 0; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      background: rgba(45, 42, 74, 0.55); line-height: 1.6;
    }
    .popup-box {
      background: #fffaf0; color: #e4572e; text-align: center;
      font-size: calc(var(--px, 2) * 5px + 2px);
      padding: 1em 1.4em;
      border: 4px solid #2d2a4a; box-shadow: 5px 5px 0 #2d2a4a;
      animation: pop 0.25s ease-out;
    }
    @keyframes pop { from { transform: scale(0.6); opacity: 0; } }
    #popupFace {
      display: block; margin: 0 auto 0.5em;
      width: calc(var(--px, 2) * 18px); height: calc(var(--px, 2) * 32px);
      image-rendering: pixelated;
    }

    /* Your phone, calling her */
    .phone {
      position: absolute;
      width: 11em; padding: 1em 0.8em;
      background: #3b3470; color: #fff;
      border: 3px solid #2d2a4a; border-radius: 12px;
      box-shadow: 3px 3px 0 rgba(45, 42, 74, 0.35);
      text-align: center; line-height: 1.6;
    }
    .phone.ringing { animation: wiggle 0.15s steps(2) infinite alternate; }
    @keyframes wiggle { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
    .phone .avatar {
      width: 2.6em; height: 2.6em; margin: 0 auto 0.5em;
      font-size: 1.2em; background: #f27ea0; border-radius: 50%;
      display: grid; place-items: center;
    }
    .phone .name { font-size: 1.1em; display: flex; align-items: center; justify-content: center; gap: 0.4em; }
    .phone .name svg { width: 0.9em; height: auto; }
    .phone .status { font-size: 0.7em; color: #c9c3ea; margin-top: 0.4em; min-height: 1.6em; }
    .phone .status.live { color: #7bd389; }
    .phone .end { width: 3em; height: 1.4em; margin: 0.8em auto 0; background: #e4572e; border-radius: 999px; }

    /* Handy while editing; remove before sending to her */
    #replay {
      font-family: inherit; font-size: 10px; cursor: pointer;
      padding: 10px 16px; background: #fffaf0; color: #2d2a4a;
      border: 3px solid #2d2a4a; box-shadow: 3px 3px 0 #2d2a4a;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="screen"></canvas>
    <div id="bubble" class="bubble hidden"><span id="typed"></span><span id="untyped" style="visibility:hidden"></span></div>
    <div id="phone" class="phone hidden">
      <div class="avatar">B</div>
      <div class="name">
        <span id="callName"></span>
        <!-- pixel heart -->
        <svg viewBox="0 0 7 6" shape-rendering="crispEdges" fill="#ff5c8a">
          <rect x="1" y="0" width="2" height="1"/><rect x="4" y="0" width="2" height="1"/>
          <rect x="0" y="1" width="7" height="2"/><rect x="1" y="3" width="5" height="1"/>
          <rect x="2" y="4" width="3" height="1"/><rect x="3" y="5" width="1" height="1"/>
        </svg>
      </div>
      <div class="status" id="callStatus">calling</div>
      <div class="end"></div>
    </div>
    <button id="meepBtn" class="game-btn hidden"></button>
    <button id="yesBtn" class="game-btn hidden">YES</button>
    <div id="choices" class="choices hidden"></div>
    <div id="finale" class="finale hidden">
      <div class="happy"><span>HAPPY</span><span>HAPPY</span><span>HAPPY</span></div>
      <div class="day" id="finaleDay"></div>
    </div>
    <div id="popup" class="popup hidden">
      <div class="popup-box">
        <canvas id="popupFace" width="9" height="16"></canvas>
        <div id="popupText"></div>
      </div>
    </div>
  </div>
  <button id="replay">REPLAY</button>

  <script>
    // =====================================================================
    //  SETTINGS YOU CAN EDIT
    // =====================================================================
    const QUESTION  = 'Will you go on a date with me?';
    const HER_NAME  = 'bobi';             // name on your phone screen
    const CALL_LINE = 'BABY IM HERE!!!';  // what you say when she picks up
    const MEEP_LINE = 'MEEP MEEP IMA LITTLE BOBI';  // her button + what she says
    const POPUP_LINE = 'MUEHEHEHE';       // your popup after the chase
    const YAY_LINE  = 'YIPEEEE Ryuko it is!';      // what you say when she taps YES
    const DAYS      = ['Friday', 'Saturday', 'Sunday'];  // the days she can pick
    const FINALE_LINE = 'See you {day}!'; // last screen; {day} becomes the day she picked
    const CHASE_TIME = 10000;             // how long YES runs away (milliseconds)
    const YES_NEAR = 14;                  // how close (game pixels) her cursor gets before YES slides away
    const YES_SMOOTHING = 160;            // higher = lazier, smoother glide (milliseconds)
    const YES_MAX_SPEED = 0.12;           // top speed of YES (game pixels per millisecond)

    const COLORS = {
      car:      '#3f6fb5',  // RAV4 body
      carDark:  '#2f5590',  // RAV4 shading / door lines
      walls:    '#f3c7a6',  // her house
      wallLine: '#e6b494',
      roof:     '#8a3b4d',
      roofDark: '#6e2c3d',
      door:     '#e0525e',
      doorDark: '#c4434f',
    };

    // Each character is a 9x16 grid. Each letter is a colour from its palette.
    // "." means see-through.
    const ME_COLORS  = { h: '#2b2230', s: '#f1c7a0', e: '#2b2230', r: '#f19a9a',
                         t: '#4a78c9', p: '#34466b', b: '#ffffff' };
    const HER_COLORS = { h: '#6b3f26', s: '#f5d0b0', e: '#2b2230', r: '#f19a9a',
                         t: '#f27ea0', k: '#7a5cc2', b: '#e0525e' };

    const ME_STAND = [
      '..hhhhh..',
      '.hhhhhhh.',
      '.hsssssh.',
      '.sessses.',
      '.rsssssr.',
      '..sssss..',
      '..ttttt..',
      '.ttttttt.',
      'ttttttttt',
      'ttttttttt',
      's.ttttt.s',
      '..ppppp..',
      '..pp.pp..',
      '..pp.pp..',
      '..pp.pp..',
      '.bbb.bbb.',
    ];
    const ME_WALK = [...ME_STAND.slice(0, 12),
      '..pp.pp..',
      '.pp...pp.',
      '.pp...pp.',
      'bbb...bbb',
    ];

    const HER_STAND = [
      '..hhhhh..',
      '.hhhhhhh.',
      'hhssssshh',
      'hsesssesh',
      'hrsssssrh',
      'hh.sss.hh',
      'hhttttthh',
      'httttttth',
      '.ttttttt.',
      's.ttttt.s',
      '.kkkkkkk.',
      'kkkkkkkkk',
      '..s...s..',
      '..s...s..',
      '..s...s..',
      '.bb...bb.',
    ];
    const HER_WALK = [...HER_STAND.slice(0, 12),
      '..s...s..',
      '.s.....s.',
      '.s.....s.',
      'bb.....bb',
    ];

    const HEART = ['.h.h.', 'hhhhh', 'hhhhh', '.hhh.', '..h..'];

    // Cats: o = outline, w = fur, p = pink ears, e = eyes, m = mouth
    const CAT_IDLE = [
      '.o.....o.',
      'opo...opo',
      'owwooowwo',
      'owwwwwwwo',
      'owewwwewo',
      'owwwmwwwo',
      '.owwwwwo.',
      '.owwwwwo.',
      'owwwwwwwo',
      'owwwwwwwo',
      '.owo.owo.',
    ];
    const CAT_HAPPY = [            // mid-hop: eyes squeezed shut, mouth wide open
      '.o.....o.',
      'opo...opo',
      'owwooowwo',
      'owwwwwwwo',
      'oeewwweeo',
      'owwmmmwwo',
      '.owwmwwo.',
      '.owwwwwo.',
      'owwwwwwwo',
      'owwwwwwwo',
      '.owo.owo.',
    ];
    const CAT_LOOKS = [            // fur and outline colours, mostly white like the meme cat
      { w: '#ffffff', o: '#55536a' },
      { w: '#ffffff', o: '#55536a' },
      { w: '#f4a259', o: '#a65b1f' },
      { w: '#ffffff', o: '#55536a' },
      { w: '#b9b6c8', o: '#55536a' },
    ];
    // Where each cat stands (game pixels): lawn on the left, then along the road
    const CAT_SPOTS = [[24, 136], [44, 130], [62, 138], [148, 136],
                       [66, 172], [86, 165], [106, 173], [126, 165], [146, 172]];

    // =====================================================================
    //  SCENE LAYOUT (in "game pixels"; the canvas is 160 x 176)
    // =====================================================================
    const W = 160, H = 176;
    const ROAD_Y = 171;      // where feet touch the road
    const PORCH_Y = 124;     // where feet touch her porch
    const WALK_SPEED = 0.03; // game pixels per millisecond

    const car  = { x: -48, y: 151, wheel: 0, doorOpen: false };
    const me   = { x: 0, y: 0, visible: false, walking: false, walkTime: 0, inCar: true };
    const her  = { x: 0, y: 0, visible: false, walking: false, walkTime: 0 };
    const house = { doorOpen: false, shaking: false };
    const hearts = [];
    const cats = [];
    let time = 0;

    // =====================================================================
    //  DRAWING HELPERS
    // =====================================================================
    let g; // the canvas we are currently drawing on
    const rect = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
    const px = (x, y, c) => rect(x, y, 1, 1, c);
    function circle(cx, cy, r, c) {
      for (let dy = -r; dy <= r; dy++)
        for (let dx = -r; dx <= r; dx++)
          if (dx * dx + dy * dy <= r * r + r * 0.8) px(cx + dx, cy + dy, c);
    }
    // Draw a sprite centred on x, standing on footY
    function sprite(rows, palette, x, footY) {
      const left = Math.round(x) - Math.floor(rows[0].length / 2);
      const top = Math.round(footY) - rows.length;
      rows.forEach((row, ry) => {
        [...row].forEach((ch, rx) => { if (palette[ch]) px(left + rx, top + ry, palette[ch]); });
      });
    }
    // Tiny 3x5 pixel letters for the street sign
    const FONT = {
      C: ['111', '100', '100', '100', '111'],
      O: ['111', '101', '101', '101', '111'],
      V: ['101', '101', '101', '101', '010'],
      E: ['111', '100', '111', '100', '111'],
    };
    function pixelText(text, x, y, c) {
      [...text].forEach((ch, i) => FONT[ch].forEach((row, ry) =>
        [...row].forEach((bit, rx) => { if (bit === '1') px(x + i * 4 + rx, y + ry, c); })));
    }

    // =====================================================================
    //  THE BACKGROUND (drawn once, since it never moves)
    // =====================================================================
    const bg = document.createElement('canvas');
    bg.width = W; bg.height = H;

    function drawBackground() {
      g = bg.getContext('2d');

      // Sunset sky in bands, with a checkerboard blend between each band
      const SKY = ['#2f2a63', '#4b3480', '#7a3f8f', '#b64f8a', '#e2667a', '#f58a6a', '#f9b26b', '#fcd58a'];
      const bandH = 100 / SKY.length;
      for (let y = 0; y < 100; y++) {
        const i = Math.floor(y / bandH);
        const next = SKY[Math.min(i + 1, SKY.length - 1)];
        const blending = y - i * bandH > bandH - 3;
        if (!blending) { rect(0, y, W, 1, SKY[i]); continue; }
        for (let x = 0; x < W; x++) px(x, y, (x + y) % 2 === 0 ? next : SKY[i]);
      }
      // Stars
      [[12, 6], [40, 14], [75, 4], [104, 11], [138, 7], [150, 18], [60, 20]].forEach(([x, y]) => px(x, y, '#fff6d6'));
      // Clouds
      [[96, 26], [10, 40], [124, 46]].forEach(([x, y]) => {
        rect(x + 4, y, 10, 2, '#ffd0dc'); rect(x, y + 2, 22, 3, '#f6a5c0'); rect(x + 14, y + 1, 5, 1, '#ffd0dc');
      });
      // Sun, low behind the houses
      circle(46, 96, 13, '#ffe08a');
      circle(46, 96, 9, '#fff2b8');

      // Neighbour houses (purple because of the dusk light)
      function neighbour(x, w, h) {
        const rh = Math.floor(w / 3);
        rect(x, 100 - h, w, h, '#8a5a8f');
        for (let i = 0; i < rh; i++) {
          const inset = Math.round((rh - i) * (w / 2) / rh);
          rect(x + inset, 100 - h - rh + i, w - 2 * inset, 1, '#6b3f6e');
        }
        rect(x + 4, 100 - h + 5, 4, 4, '#ffd36e');
        rect(x + w - 8, 100 - h + 5, 4, 4, '#ffd36e');
      }
      neighbour(2, 26, 16);
      neighbour(34, 30, 20);
      neighbour(150, 16, 18);

      // Trees
      rect(69, 94, 3, 8, '#5a3d2e'); circle(70, 86, 9, '#3e7d55'); circle(67, 83, 5, '#4f9566');
      circle(157, 80, 8, '#3e7d55');

      // Lawn
      rect(0, 100, W, 40, '#6dbb5e');
      for (let i = 0; i < 140; i++) px(Math.floor(Math.random() * W), 100 + Math.floor(Math.random() * 40), '#5aa651');

      // ---------- Her house ----------
      rect(130, 56, 7, 14, '#9c4a3f'); rect(129, 55, 9, 2, '#7a3a32');          // chimney
      for (let y = 54; y < 78; y++) {                                             // roof
        const half = Math.round((y - 53) * 36 / 24);
        rect(116 - half, y, half * 2, 1, (y - 54) % 4 === 3 ? COLORS.roofDark : COLORS.roof);
      }
      rect(84, 78, 64, 44, COLORS.walls);                                          // walls
      for (let y = 82; y < 122; y += 4) rect(84, y, 64, 1, COLORS.wallLine);       // siding
      rect(84, 78, 64, 2, '#d9a98b');                                              // shadow under roof
      rect(112, 63, 8, 8, '#fff'); rect(113, 64, 6, 6, '#ffd36e');                 // attic window
      rect(116, 64, 1, 6, '#fff'); rect(113, 67, 6, 1, '#fff');

      function window_(x, y, w, h) {
        rect(x - 1, y - 1, w + 2, h + 2, '#fff');
        rect(x, y, w, h, '#ffd36e');
        rect(x, y, w, 2, '#ffe9a8');
        rect(x + Math.floor(w / 2), y, 1, h, '#fff');
        rect(x, y + Math.floor(h / 2), w, 1, '#fff');
        rect(x - 1, y + h + 1, w + 2, 2, '#8a3b4d');                               // flower box
        for (let fx = x; fx < x + w; fx += 3) px(fx, y + h, '#ff7aa8');
      }
      window_(89, 87, 13, 11);
      window_(125, 87, 15, 11);

      rect(107, 103, 12, 19, '#fff');                                              // door frame
      rect(120, 100, 3, 3, '#fff2b8'); px(121, 99, '#55536a');                     // porch light
      rect(94, 122, 40, 3, '#cdb9a6'); rect(94, 125, 40, 1, '#a89482');            // porch
      rect(97, 126, 13, 2, '#cdb9a6');                                             // step
      for (let y = 129; y < 140; y += 4) rect(99, y, 7, 2, '#e0d6c8');            // stone path

      // Bushes with flowers
      [[90, 118], [142, 118]].forEach(([x, y]) => {
        circle(x, y, 5, '#3f8f4f'); circle(x - 1, y - 1, 3, '#4fa35d');
        px(x - 3, y - 2, '#ff7aa8'); px(x + 2, y - 3, '#ff7aa8'); px(x + 3, y + 1, '#fff'); px(x - 1, y + 2, '#ff7aa8');
      });

      // Mailbox
      rect(77, 127, 2, 13, '#6b4a3a');
      rect(73, 122, 10, 6, '#e0525e'); rect(73, 122, 10, 1, '#f07a84');
      rect(82, 119, 1, 4, '#ffd36e');

      // "COVE" street sign
      rect(12, 108, 2, 32, '#8a8a96');
      rect(3, 101, 20, 8, '#2f8f4f'); rect(3, 101, 20, 1, '#4fb06c');
      pixelText('COVE', 5, 103, '#ffffff');

      // Sidewalk, curb, road
      rect(0, 140, W, 6, '#d9d4cc');
      for (let x = 8; x < W; x += 16) rect(x, 140, 1, 6, '#bfb8ad');
      rect(0, 146, W, 2, '#a9a298');
      rect(0, 148, W, 28, '#55536a');
      for (let i = 0; i < 60; i++) px(Math.floor(Math.random() * W), 148 + Math.floor(Math.random() * 28), '#625f78');
    }

    // =====================================================================
    //  THINGS THAT MOVE (drawn every frame)
    // =====================================================================
    function drawCar() {
      const x = Math.round(car.x), y = car.y;
      const glass = '#9fd3e6', trim = '#2a2a33';

      rect(x + 8, y - 1, 18, 1, trim);                                       // roof rails
      for (let i = 0; i < 7; i++) rect(x + 6 - (i > 4 ? 1 : 0), y + i, 24 + i, 1, COLORS.car); // cabin
      rect(x, y + 7, 42, 7, COLORS.car);                                     // body
      rect(x + 8, y + 1, 8, 5, glass);                                       // back window
      for (let i = 1; i < 6; i++) rect(x + 18, y + i, 8 + i, 1, glass);      // front window
      px(x + 20, y + 2, '#e8f7fb'); px(x + 21, y + 3, '#e8f7fb');            // glint
      if (me.inCar) sprite(ME_STAND.slice(0, 5), ME_COLORS, x + 23, y + 6);  // your head in the window
      rect(x + 16, y + 1, 2, 6, COLORS.carDark);                             // pillar
      rect(x + 30, y + 5, 2, 2, trim);                                       // side mirror
      rect(x + 17, y + 7, 1, 6, COLORS.carDark);                             // door lines
      rect(x + 29, y + 7, 1, 6, COLORS.carDark);
      rect(x + 20, y + 8, 2, 1, COLORS.carDark); rect(x + 32, y + 8, 2, 1, COLORS.carDark);
      rect(x, y + 13, 42, 3, trim);                                          // black lower trim
      rect(x + 40, y + 8, 2, 2, '#fff2b8');                                  // headlight
      rect(x, y + 8, 2, 3, '#e0525e');                                       // taillight

      if (car.doorOpen) {
        rect(x + 18, y + 7, 11, 6, trim);                                    // dark doorway
        rect(x + 28, y + 5, 5, 10, COLORS.car);                              // open door
        rect(x + 28, y + 5, 1, 10, COLORS.carDark);
      }

      [[x + 9, y + 16], [x + 33, y + 16]].forEach(([cx, cy]) => {             // wheels
        circle(cx, cy, 4, '#22222a');
        circle(cx, cy, 2, '#b8b8c4');
        px(cx + Math.round(Math.cos(car.wheel) * 1.4), cy + Math.round(Math.sin(car.wheel) * 1.4), '#22222a');
      });
    }

    function drawDoor() {
      if (house.doorOpen) {
        rect(108, 104, 10, 18, '#ffe7a8');     // warm light from inside
        rect(108, 104, 2, 18, COLORS.doorDark); // door swung open
        rect(104, 122, 18, 1, '#f3e2b8');       // light spilling on the porch
        return;
      }
      const s = house.shaking ? Math.floor(time / 50) % 2 : 0;
      rect(108 + s, 104, 10, 18, COLORS.door);
      rect(110 + s, 106, 6, 5, COLORS.doorDark);
      rect(110 + s, 113, 6, 7, COLORS.doorDark);
      px(116 + s, 113, '#ffd36e');
    }

    function drawPerson(p, stand, walk, palette) {
      if (!p.visible) return;
      const frame = p.walking && Math.floor(p.walkTime / 150) % 2 ? walk : stand;
      sprite(frame, palette, p.x, p.y);
    }

    // =====================================================================
    //  SCREEN SETUP + ANIMATION LOOP
    // =====================================================================
    const canvas = document.getElementById('screen');
    const ctx = canvas.getContext('2d');
    const buffer = document.createElement('canvas');   // draw small, then blow it up
    buffer.width = W; buffer.height = H;
    const bctx = buffer.getContext('2d');
    let scale = 2;

    function resize() {
      const availW = Math.min(window.innerWidth - 40, 720);
      const availH = window.innerHeight - 120;
      scale = Math.max(1, Math.floor(Math.min(availW / W, availH / H)));
      canvas.width = W * scale;
      canvas.height = H * scale;
      placeBubble();
      phone.style.left = 6 * scale + 'px';
      phone.style.top = 6 * scale + 'px';
      phone.style.fontSize = (scale * 4 + 2) + 'px';
      document.documentElement.style.setProperty('--px', scale);  // sizes the buttons + popup
    }

    function render() {
      g = bctx;
      bctx.drawImage(bg, 0, 0);
      drawDoor();
      drawCar();
      drawPerson(her, HER_STAND, HER_WALK, HER_COLORS);
      drawPerson(me, ME_STAND, ME_WALK, ME_COLORS);
      cats.forEach(c => {                                  // bounce, bounce, bounce
        if (time < c.showAt) return;
        const hop = Math.abs(Math.sin(time / 170 + c.phase)) * 7;
        sprite(hop > 2 ? CAT_HAPPY : CAT_IDLE, c.palette, c.x, c.y - hop);
      });
      hearts.forEach(h => {
        if (h.life < h.delay) return;
        bctx.globalAlpha = Math.max(0, 1 - (h.life - h.delay) / 1800);
        sprite(HEART, { h: '#ff5c8a' }, h.x, h.y);
        bctx.globalAlpha = 1;
      });
      ctx.imageSmoothingEnabled = false;  // keeps the pixels sharp
      ctx.drawImage(buffer, 0, 0, W * scale, H * scale);
    }

    // "Tasks" are little jobs that run a bit every frame until they're done
    const tasks = [];
    const task = fn => new Promise(done => tasks.push({ fn, done }));
    const wait = ms => { let t = 0; return task(dt => (t += dt) >= ms); };
    const tween = (ms, apply) => { let t = 0; return task(dt => { t = Math.min(t + dt, ms); apply(t / ms); return t >= ms; }); };
    const easeOut = p => 1 - Math.pow(1 - p, 3);

    function walkTo(p, x, y) {
      return task(dt => {
        const dx = x - p.x, dy = y - p.y, dist = Math.hypot(dx, dy);
        const step = WALK_SPEED * dt;
        if (dist <= step) { p.x = x; p.y = y; p.walking = false; return true; }
        p.x += dx / dist * step;
        p.y += dy / dist * step;
        p.walking = true;
        p.walkTime += dt;
        return false;
      });
    }

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(now - last, 50);
      last = now;
      time += dt;
      for (let i = tasks.length - 1; i >= 0; i--) {
        if (tasks[i].fn(dt)) { tasks[i].done(); tasks.splice(i, 1); }
      }
      for (let i = hearts.length - 1; i >= 0; i--) {
        const h = hearts[i];
        h.life += dt;
        if (h.life > h.delay) h.y -= dt * 0.02;
        if (h.life > h.delay + 1800) hearts.splice(i, 1);
      }
      render();
      requestAnimationFrame(loop);
    }

    // =====================================================================
    //  SPEECH BUBBLE
    // =====================================================================
    const bubble = document.getElementById('bubble');
    const phone = document.getElementById('phone');
    const callStatus = document.getElementById('callStatus');
    document.getElementById('callName').textContent = HER_NAME;
    const typed = document.getElementById('typed');
    const untyped = document.getElementById('untyped');
    let anchor = null;

    // Keeps the bubble inside the scene, with its tail pointing at the speaker
    function placeBubble() {
      if (!anchor) return;
      bubble.style.fontSize = (scale * 4 + 2) + 'px';
      bubble.style.maxWidth = (scale * 110) + 'px';
      const ax = anchor.x * scale;
      const w = bubble.offsetWidth;
      const left = Math.min(Math.max(ax - w / 2, 4), canvas.width - w - 4);
      bubble.style.left = left + 'px';
      bubble.style.top = anchor.y * scale + 'px';
      bubble.style.setProperty('--tail', (ax - left) + 'px');
    }
    function showBubble(text, x, y, invisibleRest = '') {
      anchor = { x, y };
      typed.textContent = text;
      untyped.textContent = invisibleRest;
      bubble.classList.remove('hidden');
      placeBubble();
    }
    function hideBubble() { bubble.classList.add('hidden'); anchor = null; }
    async function typeBubble(text, x, y) {
      showBubble('', x, y, text);
      for (let i = 1; i <= text.length; i++) {
        typed.textContent = text.slice(0, i);
        untyped.textContent = text.slice(i);  // invisible, keeps the bubble from resizing
        await wait(45);
      }
    }

    // =====================================================================
    //  THE STORY
    // =====================================================================
    async function play() {
      await wait(400);

      // Scene 1: the RAV4 pulls up to her house
      await tween(3200, p => {
        const nx = -48 + (14 + 48) * easeOut(p);
        car.wheel += (nx - car.x) / 4;
        car.x = nx;
      });
      await wait(500);

      // Scene 2: you call her from the car
      const windowX = car.x + 23, windowY = car.y - 1;   // where your speech bubbles point
      await wait(400);
      phone.classList.remove('hidden');
      phone.classList.add('ringing');
      for (let i = 1; i <= 8; i++) {
        callStatus.textContent = 'calling' + '.'.repeat(i % 4);
        await wait(300);
      }
      phone.classList.remove('ringing');
      callStatus.textContent = '0:01';
      callStatus.classList.add('live');
      await wait(500);
      showBubble(CALL_LINE, windowX, windowY);
      await wait(2000);
      hideBubble();
      phone.classList.add('hidden');
      await wait(500);

      // Scene 3: she comes outside, you hop out to meet her, then ask the question
      house.doorOpen = true;
      await wait(500);
      her.visible = true; her.x = 113; her.y = PORCH_Y;
      await Promise.all([            // both of these happen at the same time
        (async () => {               // her: down the path to the sidewalk
          await walkTo(her, 102, PORCH_Y);
          house.doorOpen = false;
          await walkTo(her, 102, 146);
          await walkTo(her, 94, 146);
        })(),
        (async () => {               // you: out of the car and over to her
          car.doorOpen = true;
          await wait(350);
          me.inCar = false; me.visible = true; me.x = car.x + 24; me.y = ROAD_Y;
          await wait(350);
          car.doorOpen = false;
          await walkTo(me, 80, 146);
        })(),
      ]);
      for (let i = 0; i < 5; i++) hearts.push({ x: 79 + i * 4, y: 128, delay: i * 150, life: 0 });
      await wait(900);
      await typeBubble(QUESTION, me.x, me.y - 19);

      // Scene 4: MEEP MEEP, then the runaway YES
      const buttonX = () => canvas.width / 2;   // buttons sit in the empty sky
      const buttonY = () => 40 * scale;
      await wait(600);
      meepBtn.textContent = MEEP_LINE;
      meepBtn.style.left = buttonX() + 'px';
      meepBtn.style.top = buttonY() + 'px';
      meepBtn.classList.remove('hidden');
      await clickOnce(meepBtn);
      meepBtn.classList.add('hidden');
      await typeBubble(MEEP_LINE, her.x, her.y - 19);
      await wait(1800);
      showBubble(QUESTION, me.x, me.y - 19);    // you ask again

      yesPos.x = buttonX(); yesPos.y = buttonY();
      yesBtn.classList.remove('hidden');
      moveYes();
      yesBtn.style.pointerEvents = 'none';      // can't be tapped while it's running
      chasing = true;
      await runAwayFor(CHASE_TIME);
      chasing = false;
      yesBtn.style.pointerEvents = '';

      await showPopup(POPUP_LINE);
      yesBtn.classList.add('ready');            // YES gives up: slides to the middle and glows
      yesPos.x = buttonX(); yesPos.y = buttonY();
      moveYes();
      await clickOnce(yesBtn);
      yesBtn.classList.add('hidden');
      hideBubble();
      for (let i = 0; i < 8; i++) hearts.push({ x: 74 + i * 4, y: 128, delay: i * 120, life: 0 });

      // Scene 5: you celebrate, she picks a day
      await wait(600);
      await typeBubble(YAY_LINE, me.x, me.y - 19);
      await wait(700);
      const chosenDay = await pickOne(DAYS);
      await typeBubble(chosenDay + '!', her.x, her.y - 19);
      await wait(1500);
      hideBubble();

      // Scene 6: a bunch of cats going HAPPY HAPPY HAPPY
      CAT_SPOTS.forEach(([x, y], i) => cats.push({
        x, y,
        phase: i * 0.7,
        showAt: time + i * 150,                            // they pop in one after another
        palette: { ...CAT_LOOKS[i % CAT_LOOKS.length], p: '#ffb3c6', e: '#2b2230', m: '#c0392b' },
      }));
      document.getElementById('finaleDay').textContent = FINALE_LINE.replace('{day}', chosenDay);
      document.getElementById('finale').classList.remove('hidden');
    }

    // Show a row of buttons; wait until she taps one, then return its text
    function pickOne(options) {
      const box = document.getElementById('choices');
      box.innerHTML = '';
      return new Promise(done => {
        options.forEach(opt => {
          const b = document.createElement('button');
          b.textContent = opt;
          b.addEventListener('click', () => { box.classList.add('hidden'); done(opt); });
          box.appendChild(b);
        });
        box.classList.remove('hidden');
      });
    }

    // =====================================================================
    //  SCENE 4 HELPERS: buttons, the runaway YES, the popup
    // =====================================================================
    const meepBtn = document.getElementById('meepBtn');
    const yesBtn = document.getElementById('yesBtn');
    const popup = document.getElementById('popup');
    const yesPos = { x: 0, y: 0 };            // centre of YES, in screen pixels inside the scene
    const ptr = { x: -9999, y: -9999 };       // her cursor/finger, same units
    let chasing = false;

    const clickOnce = el => new Promise(done => el.addEventListener('click', done, { once: true }));
    const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);

    function moveYes() {
      yesBtn.style.left = yesPos.x + 'px';
      yesBtn.style.top = yesPos.y + 'px';
    }
    let yesTarget = null;                     // where YES is gliding to

    // If her cursor is about to touch YES, pick a spot just out of its reach
    function updateYesTarget() {
      const near = YES_NEAR * scale;
      const hw = yesBtn.offsetWidth / 2, hh = yesBtn.offsetHeight / 2;
      const dx = yesPos.x - ptr.x, dy = yesPos.y - ptr.y;
      if (Math.abs(dx) > hw + near || Math.abs(dy) > hh + near) return;  // not close yet

      // Slide straight away from the cursor until it's just past the edge
      const len = Math.hypot(dx, dy);
      const ux = len ? dx / len : 1, uy = len ? dy / len : 0;
      const reach = Math.min(
        ux ? (hw + near * 1.5) / Math.abs(ux) : Infinity,
        uy ? (hh + near * 1.5) / Math.abs(uy) : Infinity);
      let tx = ptr.x + ux * reach, ty = ptr.y + uy * reach;

      // Keep it inside the scene
      const minX = hw + 4, maxX = canvas.width - hw - 4;
      const minY = hh + 4, maxY = canvas.height - hh - 4;
      let cx = clamp(tx, minX, maxX), cy = clamp(ty, minY, maxY);

      // Pinned against an edge? Slide along that edge, toward the side with more room
      // (it also dashes a bit faster here so she can't trap it in a corner)
      const stillReachable = Math.abs(cx - ptr.x) < hw + near && Math.abs(cy - ptr.y) < hh + near;
      if (stillReachable) {
        if (cx !== tx) cy = ptr.y < canvas.height / 2 ? ptr.y + 2 * (hh + near) : ptr.y - 2 * (hh + near);
        else           cx = ptr.x < canvas.width / 2  ? ptr.x + 2 * (hw + near) : ptr.x - 2 * (hw + near);
        cx = clamp(cx, minX, maxX);
        cy = clamp(cy, minY, maxY);
      }
      yesTarget = { x: cx, y: cy, dash: stillReachable };
    }

    // Each frame for `ms` milliseconds: YES eases toward its target, never faster than the top speed
    function runAwayFor(ms) {
      let t = 0;
      yesTarget = null;
      return task(dt => {
        t += dt;
        updateYesTarget();
        if (yesTarget) {
          const ease = 1 - Math.exp(-dt / YES_SMOOTHING);
          let mx = (yesTarget.x - yesPos.x) * ease, my = (yesTarget.y - yesPos.y) * ease;
          const maxStep = YES_MAX_SPEED * (yesTarget.dash ? 3 : 1) * scale * dt;
          const step = Math.hypot(mx, my);
          if (step > maxStep) { mx *= maxStep / step; my *= maxStep / step; }
          yesPos.x += mx;
          yesPos.y += my;
          moveYes();
        }
        return t >= ms;
      });
    }

    function trackPointer(e) {
      const r = canvas.getBoundingClientRect();
      ptr.x = e.clientX - r.left;
      ptr.y = e.clientY - r.top;
    }
    window.addEventListener('pointermove', trackPointer);
    window.addEventListener('pointerdown', trackPointer);  // a tap on a phone counts too

    async function showPopup(text) {
      g = document.getElementById('popupFace').getContext('2d');
      sprite(ME_STAND, ME_COLORS, 4, 16);
      const out = document.getElementById('popupText');
      out.textContent = '';
      popup.classList.remove('hidden');
      for (let i = 1; i <= text.length; i++) {
        out.textContent = text.slice(0, i);
        await wait(90);
      }
      await wait(1500);
      popup.classList.add('hidden');
    }

    document.getElementById('replay').addEventListener('click', () => location.reload());
    window.addEventListener('resize', resize);
    drawBackground();
    resize();
    requestAnimationFrame(loop);
    play();
  </script>
</body>
</html>
